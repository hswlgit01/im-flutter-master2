buildscript {
    // dawn 2026-06-22 修复 Android 调试构建：camera_android_camerax 依赖 Kotlin 2.1 元数据，需要同步升级 Kotlin 插件。
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath("com.android.tools:r8:8.3.37")
        // dawn 2026-06-22 修复 Android 调试构建：AndroidX Camera 1.6 要求 AGP 8.9.1+。
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath 'com.google.gms:google-services:4.4.2'  // fcm
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()  // io.github.maitrungduc1410 在 Maven Central
        maven { url 'https://jitpack.io' }
        maven { url 'https://mvn.getui.com/nexus/content/repositories/releases/' }  // GeTui Maven 仓库
        // FFmpeg Kit 官方仓库已不可用，使用 Maven Central 中的替代版本
        // maven { url 'https://github.com/arthenica/ffmpeg-kit/releases' }
    }

    // 全局依赖替换：将所有 com.arthenica 替换为 io.github.maitrungduc1410
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'com.arthenica' && details.requested.name == 'ffmpeg-kit-https') {
                    details.useTarget group: 'io.github.maitrungduc1410', name: 'ffmpeg-kit-https', version: '6.0.1'
                    details.because 'com.arthenica package no longer available, using community fork'
                }
            }
        }
    }
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        subproject.android {
            // dawn 2026-06-22 修复 Android 调试构建：旧 Flutter 插件未声明 namespace，AGP 8+ 需要自动补齐。
            if (namespace == null || namespace.isEmpty()) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                def fallbackNamespace = "com.freechat.${subproject.name.replace('-', '_')}"
                if (manifestFile.exists()) {
                    def manifestPackage = new XmlParser(false, false).parse(manifestFile).attribute('package')
                    namespace = manifestPackage ?: fallbackNamespace
                } else {
                    namespace = fallbackNamespace
                }
            }
            compileSdkVersion 36
        }
    }
}

rootProject.buildDir = '../build'
subprojects { afterEvaluate { android { compileSdkVersion 36 } } }

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
