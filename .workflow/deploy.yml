version: '1.0'
name: build-im-flutter-android
displayName: 构建并发布 im-flutter Android

# dawn 2026-06-22 迁移 Gitee Go：Flutter Android APK 改由 Gitee 主机组构建后发布到服务器下载目录。
triggers:
  push:
    branches:
      include:
        - main
        - master
        - dev
    tags:
      include:
        - v*

stages:
  - stage:
      name: build_android
      displayName: 构建 Android APK
      steps:
        - step: shell@agent
          name: build_apk
          displayName: Flutter 构建并发布 APK
          hostGroupID: freechat-prod
          script: |
            set -euo pipefail

            export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
            export PATH="${JAVA_HOME}/bin:${PATH}"

            BRANCH_NAME="${GITEE_BRANCH:-${BRANCH_NAME:-}}"
            ENV_VALUE=prod
            if [ "${BRANCH_NAME}" = "dev" ]; then
              ENV_VALUE=test
            fi

            flutter --version
            flutter pub get
            flutter build apk --release --split-per-abi --dart-define=ENV="${ENV_VALUE}"

            mkdir -p /data/app/apk/public
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /data/app/apk/public/app-release.apk
            ls -lh /data/app/apk/public/app-release.apk
