name: Build Flutter App

on:
  push:
    branches: [master, main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: '构建环境'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  FLUTTER_VERSION: '3.41.4'
  JAVA_VERSION: '17'

jobs:
  # ========== 构建 Android APK ==========
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          # dawn 2026-06-23 CI 提速:缓存 Flutter SDK + pub-cache,避免每次重新下载。
          cache: true

      # dawn 2026-06-23 CI 提速:缓存 Gradle 依赖与 wrapper,避免每次重新下载/解析。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      # dawn 2026-06-23 兼容补丁:移除老插件里已被 Flutter 3.29+ 删除的 v1 registerWith(Registrar)，
      # 否则 image_cropper/ffmpeg 等老插件在新 Flutter 上 compileReleaseJavaWithJavac 失败。
      - name: Patch legacy v1 plugins
        run: python3 tool/patch_v1_plugins.py

      - name: Build APK
        run: |
          ENV_VALUE="${{ github.event.inputs.environment }}"
          ENV_VALUE="${ENV_VALUE:-prod}"
          # dawn 2026-06-23 CI 提速:线上只分发 arm64,直接只编 arm64(免去 v7a/x86_64 两份原生库编译,约省 2/3 时间)。
          # 产物即 app-release.apk(单一 arm64 包),无需再 cp。
          flutter build apk --release --target-platform android-arm64 --dart-define=ENV="$ENV_VALUE"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # apk-server 容器挂载了 /data/app/apk/public，把 APK 丢进去就能直接下载
      - name: Copy APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "build/app/outputs/flutter-apk/app-release.apk"
          target: "/data/app/apk/public/"
          # strip the 4 leading directories (build/app/outputs/flutter-apk), keep
          # just the filename. Previous value 5 stripped the filename too and scp
          # silently dropped the tarball, leaving the server with the old APK.
          strip_components: 4

  # ========== 构建 iOS（仅在 tag 推送时触发，需要 Mac Runner） ==========
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          cd ios
          pod install
          cd ..
          flutter build ipa --release --dart-define=ENV=prod

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.ipa
          path: build/ios/ipa/*.ipa
